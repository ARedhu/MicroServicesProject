server:
  port: 8888
spring:
  application:
    name: config-server
  config:
    import: optional:file.env[.properties]
  cloud:
    config:
      server:
        git:
          uri: ${URI}
          username: ${USER_NAME}
          password: ${PASSWORD}
          default-label: main # we mention branch name here.
# .env access issue was there. That's why used these variables directly here.
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/